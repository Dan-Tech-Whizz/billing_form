<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title> Q2 - Fun With Forms</title>
        <link rel = "stylesheet" href = "styles.css">

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    </head>

    <body>
        <h2> Fun With Forms</h2>
        <hr>

        <form id = "funForm">
            <fieldset>
                <legend> Billing Information </legend>

                <div class = "form-row">
                    <label for= "name"> NAME</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-row">
                    <label for= "email">EMAIL</label>
                    <input type="text" id="email" name="email">
                </div>

                <div class="form-row">
                    <label for= "address">ADDRESS</label>
                    <input type="text" id="address" name="address">
                </div>

                <div class="form-row">
                    <label for= "city">CITY</label>
                    <input type="text" id="city" name="city">
                </div>

                <div class="form-row">
                    <label for= "state">STATE/PROVINCE</label>
                    <input type="text" id="state" name="state">
                </div>

                <div class="form-row">
                    <label for= "postal">POSTAL CODE</label>
                    <input type="text" id="postal" name="postal">
                </div>

                <div class="form-row">
                    <label for= "country">COUNTRY</label>
                    <select id="country" name="country">
                        <option value=""> Choose your contry</option>
                        <option value="JM">Jamaica</option>
                        <option value="US">United States</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>PAYMENT METHOD</label>
                    <div class="radio-options">
                        <input type="radio" name="payment" value="paypal" id="pay_paypal" checked> PayPal
                        <input type="radio" name="payment" value="visa" id="pay_visa"> Visa
                        <input type="radio" name="payment" value="mastercard" id="pay_master"> MasterCard
                    </div>
                </div>

                <div class="form-row">
                    <label for="card_number">CARD NUMBER</label>
                    <input type="text" id="card_number" name="card_number" class="payment-card-field">
                </div>

                <div class="form-row">
                    <label for="exp_date">EXPIRATION DATE</label>
                    <input type="text" id="exp_date" name="exp_date" class="payment-card-field" placeholder="MM/YY">
                </div>           
            </fieldset>

            <!-- Shipping Details Block -->
            <fieldset>
                <legend>Shipping Information</legend>
                <div class="form-row checkbox-row">
                    <input type="checkbox" id="same_as_billing" name="same_as_billing" checked> 
                    <label for="same_as_billing" class="inline-label">Same as billing</label>
                </div>

                <!-- This sub-container handles the extra shipping form layout fields -->
                <div id="shippingFields" style="display:none">
                    <div class="form-row"><label for="sName">Name</label>
                    <input type="text" id="sName" name="sName"></div>
                    <div class="form-row"><label for="sAddress">Address</label>
                    <input type="text" id="sAddress" name="sAddress"></div>
                    <div class="form-row"><label for="sCity">City</label>
                    <input type="text" id="sCity" name="sCity"></div>
                    <div class="form-row"><label for="sState">State/Province</label>
                    <input type="text" id="sState" name="sState"></div>
                    <div class="form-row"><label for="sPostal">Postal Code</label>
                    <input type="text" id="sPostal" name="sPostal"></div>
                    <div class="form-row"><label for="sCountry">Country</label>
                    <select id="sCountry" name="sCountry">
                        <option value="">Choose your country</option>
                        <option>Jamaica</option>
                        <option>United States</option>    
                    </select></div>
                </div>
            </fieldset>

            <div class="button-area">
                <input type="submit" value="Submit Form">
            </div>
        </form>
        <!-- Connect your logic script file -->
        <script src="script.js"></script>
    </body>
</html>
